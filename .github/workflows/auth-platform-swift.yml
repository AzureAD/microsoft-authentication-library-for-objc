name: Auth Platform Swift CI

on:
  pull_request:
    paths:
      - "AuthPlatform/Server/**"
      - "AuthPlatform/iOS/**"
      - ".github/workflows/auth-platform-swift.yml"
  push:
    branches:
      - "feature/secure-auth-platform-vapor"
    paths:
      - "AuthPlatform/Server/**"
      - "AuthPlatform/iOS/**"
      - ".github/workflows/auth-platform-swift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-platform:
    name: Build, test, and type-check authentication code
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Build Vapor server
        working-directory: AuthPlatform/Server
        run: swift build
      - name: Run authentication unit tests
        working-directory: AuthPlatform/Server
        run: swift test
      - name: Type-check iOS passkey integration
        run: |
          IOS_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -typecheck -sdk "$IOS_SDK" -target arm64-apple-ios17.0-simulator AuthPlatform/iOS/Authentication/PasskeyService.swift
