name: Auth Platform Swift CI

on:
  pull_request:
    paths:
      - "AuthPlatform/Server/**"
      - "AuthPlatform/iOS/**"
      - ".github/workflows/auth-platform-swift.yml"
  push:
    branches:
      - "feature/secure-auth-platform-vapor"
    paths:
      - "AuthPlatform/Server/**"
      - "AuthPlatform/iOS/**"
      - ".github/workflows/auth-platform-swift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-build-test:
    name: Build and test Vapor server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.4"
      - name: Build server
        working-directory: AuthPlatform/Server
        run: swift build
      - name: Run unit tests
        working-directory: AuthPlatform/Server
        run: swift test

  ios-passkey-typecheck:
    name: Type-check iOS passkey integration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.4"
      - name: Type-check passkey integration
        run: |
          IOS_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -typecheck -sdk "$IOS_SDK" -target arm64-apple-ios17.0-simulator AuthPlatform/iOS/Authentication/PasskeyService.swift
