name: AuthPlatform iOS AutoFill

on:
  push:
    branches:
      - "feature/secure-auth-platform-vapor"
    paths:
      - "AuthPlatform/iOS/**"
      - ".github/workflows/authplatform-ios.yml"
  pull_request:
    paths:
      - "AuthPlatform/iOS/**"
      - ".github/workflows/authplatform-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Generate and build iOS host app and Credential Provider Extension
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and Swift toolchains
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -E "Xcode 26\\."
          swift --version | grep -E "Swift version 6\\."
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec AuthPlatform/iOS/project.yml --project AuthPlatform/iOS
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project AuthPlatform/iOS/AuthPlatform.xcodeproj -scheme AuthPlatform
      - name: Build iOS simulator targets
        run: |
          xcodebuild \
            -project AuthPlatform/iOS/AuthPlatform.xcodeproj \
            -scheme AuthPlatform \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/AuthPlatformDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built Credential Provider extension metadata
        run: |
          EXTENSION_INFO="$RUNNER_TEMP/AuthPlatformDerivedData/Build/Products/Debug-iphonesimulator/AuthPlatform.app/PlugIns/CredentialProviderExtension.appex/Info.plist"
          test -f "$EXTENSION_INFO"
          POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXTENSION_INFO")
          PASSWORDS=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:ASCredentialProviderExtensionCapabilities:ProvidesPasswords" "$EXTENSION_INFO")
          test "$POINT" = "com.apple.authentication-services-credential-provider-ui"
          test "$PASSWORDS" = "true"
          echo "Credential Provider extension point and password capability are present."

      - name: Run encrypted vault cryptography and recovery tests
        run: |
          xcodebuild test \
            -project AuthPlatform/iOS/AuthPlatform.xcodeproj \
            -scheme AuthPlatformTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/AuthPlatformDerivedData" \
            CODE_SIGNING_ALLOWED=NO
