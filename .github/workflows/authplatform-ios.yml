name: AuthPlatform iOS AutoFill

on:
  push:
    branches:
      - "feature/secure-auth-platform-vapor"
    paths:
      - "AuthPlatform/iOS/**"
      - ".github/workflows/authplatform-ios.yml"
  pull_request:
    paths:
      - "AuthPlatform/iOS/**"
      - ".github/workflows/authplatform-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Generate and build iOS host app and Credential Provider Extension
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and Swift toolchains
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -E "Xcode 26\\."
          swift --version | grep -E "Swift version 6\\."
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec AuthPlatform/iOS/project.yml --project AuthPlatform/iOS
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project AuthPlatform/iOS/AuthPlatform.xcodeproj -scheme AuthPlatform
      - name: Build iOS simulator targets
        run: |
          xcodebuild \\
            -project AuthPlatform/iOS/AuthPlatform.xcodeproj \\
            -scheme AuthPlatform \\
            -sdk iphonesimulator \\
            -configuration Debug \\
            -derivedDataPath "$RUNNER_TEMP/AuthPlatformDerivedData" \\
            CODE_SIGNING_ALLOWED=NO \\
            build

      - name: Verify Credential Provider source and built bundle metadata
        run: |
          SOURCE_INFO="AuthPlatform/iOS/CredentialProviderExtension/Info.plist"
          EXTENSION_INFO="$RUNNER_TEMP/AuthPlatformDerivedData/Build/Products/Debug-iphonesimulator/CredentialProviderExtension.appex/Info.plist"
          test -f "$SOURCE_INFO"
          test -f "$EXTENSION_INFO"
          plutil -lint "$SOURCE_INFO"
          plutil -lint "$EXTENSION_INFO"
          POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$SOURCE_INFO")
          PASSWORDS=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:ASCredentialProviderExtensionCapabilities:ProvidesPasswords" "$SOURCE_INFO")
          PACKAGE_TYPE=$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$EXTENSION_INFO")
          test "$POINT" = "com.apple.authentication-services-credential-provider-ui"
          test "$PASSWORDS" = "true"
          test "$PACKAGE_TYPE" = "XPC!"
          echo "Credential Provider source extension point and password capability are valid; built extension bundle is present and has XPC! package type."

      - name: Run encrypted vault cryptography and recovery tests
        run: |
          xcodebuild test \\
            -project AuthPlatform/iOS/AuthPlatform.xcodeproj \\
            -scheme AuthPlatformTests \\
            -destination 'platform=iOS Simulator,name=iPhone 17' \\
            -derivedDataPath "$RUNNER_TEMP/AuthPlatformDerivedData" \\
            CODE_SIGNING_ALLOWED=NO
