name: AuthPlatform iOS AutoFill

on:
  pull_request:
    paths:
      - "AuthPlatform/iOS/**"
      - ".github/workflows/authplatform-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Generate and build iOS host app and Credential Provider Extension
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec AuthPlatform/iOS/project.yml --project AuthPlatform/iOS
      - name: Build iOS simulator targets
        run: |
          xcodebuild \
            -project AuthPlatform/iOS/AuthPlatform.xcodeproj \
            -scheme AuthPlatform \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
