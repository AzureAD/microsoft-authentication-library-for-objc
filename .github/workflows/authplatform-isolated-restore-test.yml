name: AuthPlatform Isolated Backup Restore Test

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: "Restore the encrypted backup into a disposable PostgreSQL container"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: authplatform-isolated-restore-test
  cancel-in-progress: false

jobs:
  isolated-restore:
    if: inputs.confirm_restore == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: postgres:18-bookworm
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: restore_validation
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: restore-only-ci-password
        options: >-
          --health-cmd "pg_isready -U restore_test -d restore_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: restore_validation
      PGUSER: restore_test
      PGPASSWORD: restore-only-ci-password
      DROPBOX_RESTORE_ACCESS_TOKEN: ${{ secrets.DROPBOX_RESTORE_ACCESS_TOKEN }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Install download and decryption utilities
        shell: bash
        run: |
          set +x
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl gnupg ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Download, decrypt, and restore into disposable PostgreSQL
        shell: bash
        run: |
          set +x
          set -euo pipefail

          if [ -z "${DROPBOX_RESTORE_ACCESS_TOKEN}" ]; then
            echo "Missing GitHub Actions secret DROPBOX_RESTORE_ACCESS_TOKEN."
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "Missing GitHub Actions secret BACKUP_ENCRYPTION_PASSPHRASE."
            exit 1
          fi

          encrypted_file="$(mktemp /tmp/authplatform-backup.XXXXXX.gpg)"
          plain_file="$(mktemp /tmp/authplatform-backup.XXXXXX.dump)"
          restore_list="$(mktemp /tmp/authplatform-restore-list.XXXXXX)"
          trap 'rm -f "$encrypted_file" "$plain_file" "$restore_list"' EXIT

          http_code="$(curl --silent --show-error --connect-timeout 20 --max-time 120 \
            --output "$encrypted_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${DROPBOX_RESTORE_ACCESS_TOKEN}" \
            --header 'Dropbox-API-Arg: {"path":"/AuthPlatform Backups/authplatform-production-one-time-20261124-2320.dump.gpg"}' \
            https://content.dropboxapi.com/2/files/download)"

          if [ "$http_code" != "200" ]; then
            rm -f "$encrypted_file"
            echo "Dropbox download failed (HTTP $http_code). Check the read-only Dropbox token and app-folder access."
            exit 1
          fi

          actual_size="$(stat -c '%s' "$encrypted_file")"
          if [ "$actual_size" -ne 4377 ]; then
            echo "Downloaded archive size did not match the verified backup metadata."
            exit 1
          fi

          actual_sha="$(sha256sum "$encrypted_file" | awk '{print $1}')"
          expected_sha="8a4d60dd4496e01711a01a9245c9322aa71fd3b5c96cb22198e33b5b0ccafaff"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Downloaded encrypted archive SHA-256 did not match the verified backup."
            exit 1
          fi

          printf '%s\n' "$BACKUP_ENCRYPTION_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --decrypt --output "$plain_file" "$encrypted_file"

          if [ ! -s "$plain_file" ]; then
            echo "Decryption produced an empty PostgreSQL archive."
            exit 1
          fi

          # Prisma Postgres provides this proprietary extension; stock PostgreSQL
          # CI images do not. Exclude only its CREATE EXTENSION/COMMENT TOC entries,
          # then let pg_restore fail if application objects actually require it.
          pg_restore --list "$plain_file" > "$restore_list"
          if ! grep -q 'EXTENSION - prisma_postgres' "$restore_list"; then
            echo "Expected prisma_postgres extension entry was not found in the archive TOC."
            exit 1
          fi
          sed -i '/EXTENSION.*prisma_postgres/d' "$restore_list"
          echo "PRISMA_POSTGRES_EXTENSION=skipped_unavailable_in_stock_postgres"
          pg_restore --exit-on-error --no-owner --no-acl --use-list="$restore_list" \
            --dbname="$PGDATABASE" "$plain_file" >/dev/null

          restored_objects="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND c.relkind IN ('r','p','v','m','S');")"
          if ! [[ "$restored_objects" =~ ^[0-9]+$ ]] || [ "$restored_objects" -lt 1 ]; then
            echo "Restore completed but no user database objects were found."
            exit 1
          fi

          # Inventory the restored application schema and data in the disposable DB.
          # Inventory all application tables present in the restored schema.
          # encrypted_vault_items is also present in the archive's constraints/indexes.
          expected_tables=(
            users passkey_credentials auth_sessions oauth_accounts audit_events
            refresh_token_records one_time_auth_tokens auth_rate_limits
            passkey_challenges oidc_login_transactions encrypted_vault_items
          )
          missing_tables=0
          echo "=== APPLICATION TABLE INVENTORY ==="
          for table in "${expected_tables[@]}"; do
            # Names come from the fixed expected_tables array; avoid psql
            # variable interpolation inside SQL string literals passed via -c.
            exists="$(psql -X -A -t -v ON_ERROR_STOP=1 \
              -c "SELECT to_regclass('public.${table}') IS NOT NULL;")"
            if [ "$exists" != "t" ]; then
              echo "TABLE_MISSING=$table"
              missing_tables=$((missing_tables + 1))
              continue
            fi
            rows="$(psql -X -A -t -v ON_ERROR_STOP=1 \
              -c "SELECT count(*) FROM public.${table};")"
            echo "TABLE=$table ROW_COUNT=$rows"
          done
          echo "MISSING_APPLICATION_TABLE_COUNT=$missing_tables"
          if [ "$missing_tables" -ne 0 ]; then
            echo "APPLICATION_SCHEMA_INVENTORY=failed_missing_tables"
            exit 1
          fi

          constraint_count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE n.nspname='public';")"
          index_count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public';")"
          foreign_key_count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE n.nspname='public' AND c.contype='f';")"
          primary_key_count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE n.nspname='public' AND c.contype='p';")"
          unique_constraint_count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE n.nspname='public' AND c.contype='u';")"
          echo "PUBLIC_INDEX_COUNT=$index_count"
          echo "PUBLIC_CONSTRAINT_COUNT=$constraint_count"
          echo "PUBLIC_PRIMARY_KEY_COUNT=$primary_key_count"
          echo "PUBLIC_FOREIGN_KEY_COUNT=$foreign_key_count"
          echo "PUBLIC_UNIQUE_CONSTRAINT_COUNT=$unique_constraint_count"
          echo "=== PUBLIC CONSTRAINT DEFINITIONS ==="
          psql -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "SELECT conrelid::regclass AS table_name, conname, contype, pg_get_constraintdef(oid) AS definition FROM pg_constraint WHERE connamespace='public'::regnamespace ORDER BY 1,2;"
          echo "=== PUBLIC INDEX DEFINITIONS ==="
          psql -X -v ON_ERROR_STOP=1 -P pager=off -c \
            "SELECT tablename, indexname, indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY tablename,indexname;"
          echo "APPLICATION_SCHEMA_INVENTORY=passed"
          echo "APPLICATION_TABLE_COUNT=${#expected_tables[@]}"

          rm -f "$plain_file" "$encrypted_file" "$restore_list"
          trap - EXIT
          echo "ISOLATED_RESTORE_TEST=passed_with_extension_excluded"
          echo "RESTORE_SCOPE=all_restorable_objects_except_prisma_postgres_extension"
          echo "RESTORED_DATABASE=restore_validation (disposable PostgreSQL 18 container)"
          echo "RESTORED_OBJECT_COUNT=$restored_objects"
          echo "PRODUCTION_DATABASE_TOUCHED=false"
          echo "PLAINTEXT_ARCHIVE_REMOVED=true"
