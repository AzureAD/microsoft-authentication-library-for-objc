name: AuthPlatform Vapor Server CI

on:
  push:
    branches:
      - "feature/secure-auth-platform-vapor"
    paths:
      - "AuthPlatform/Server/**"
      - ".github/workflows/authplatform-server.yml"
  pull_request:
    paths:
      - "AuthPlatform/Server/**"
      - ".github/workflows/authplatform-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Build and test Vapor server with PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authplatform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: AuthPlatform/Server
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/authplatform_test
      HOST: 127.0.0.1
      PORT: 8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: AuthPlatform CI
      WEBAUTHN_ORIGIN: http://localhost
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Verify Swift toolchain
        run: swift --version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build release
        run: swift build -c release
      - name: Run unit and PostgreSQL integration tests
        run: swift test
