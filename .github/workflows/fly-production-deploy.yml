name: Fly.io production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authplatform-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production releases are only permitted from the repository's default branch.
    if: github.ref == 'refs/heads/dabelstech-creator-patch-1'
    name: Validate and deploy AuthPlatform Vapor API
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authplatform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/authplatform_test?sslmode=disable
      HOST: 127.0.0.1
      PORT: 8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: AuthPlatform CI
      WEBAUTHN_ORIGIN: http://localhost
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate, build, and test Vapor server
        working-directory: AuthPlatform/Server
        run: |
          swift --version
          swift package resolve
          swift build -c release
          swift test

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: 0.5.5

      - name: Verify deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Configure the FLY_API_TOKEN GitHub Actions secret before deploying."
            exit 1
          fi

      - name: Deploy production API
        working-directory: AuthPlatform/Server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml
