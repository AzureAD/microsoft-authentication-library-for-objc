name: Xcode - Build and Analyze

on:
  push:
    branches: ["dabelstech-creator-patch-1"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build MSAL iOS framework
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Type-check AuthPlatform iOS passkey integration
        run: |
          IOS_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -typecheck -sdk "$IOS_SDK" -target arm64-apple-ios17.0-simulator AuthPlatform/iOS/Authentication/PasskeyService.swift
      - name: Build and analyze shared iOS framework scheme
        run: xcodebuild -workspace MSAL.xcworkspace -scheme "MSAL (iOS Framework)" -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO clean build analyze
