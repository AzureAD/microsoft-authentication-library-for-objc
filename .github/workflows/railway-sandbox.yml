name: Railway sandbox bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-sandbox:
    name: Create private Railway sandbox
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 5d8c3286-4f2c-4a25-b8da-daf2024b4739
      RAILWAY_ENVIRONMENT_ID: 0d7fab05-2ba8-4a78-9d88-212d64f87a1f
    steps:
      - name: Validate Railway credentials
        shell: bash
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Add the RAILWAY_API_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Create sandbox on the selected project environment
        shell: bash
        run: |
          railway sandbox create \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --private-network

      - name: Run non-interactive sandbox diagnostics
        shell: bash
        run: |
          railway sandbox exec -- bash -lc '
            set -eu
            echo "=== Railway sandbox ==="
            uname -a
            echo "=== Available tools ==="
            command -v git || true
            git --version 2>/dev/null || true
            command -v node || true
            node --version 2>/dev/null || true
            echo "=== Private PostgreSQL DNS check ==="
            if getent hosts postgres.railway.internal; then
              echo "PostgreSQL private hostname resolved."
            else
              echo "PostgreSQL private hostname did not resolve; this is expected if no active Postgres service exists in this environment."
            fi
          '

      - name: Explain interactive access
        if: always()
        shell: bash
        run: |
          echo "The sandbox is not a production deployment."
          echo "For an interactive shell, open the Railway project Sandboxes tab and use SSH on the created sandbox."
          echo "Sandboxes consume Railway resources and should be destroyed when no longer needed."
