name: Swift

on:
  push:
    branches: ["dabelstech-creator-patch-1", "feature/secure-auth-platform-vapor"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-manifest:
    name: Validate MSAL Swift package manifest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate package manifest
        run: swift package dump-package > /dev/null

  auth-platform:
    name: Build and test AuthPlatform server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Build authentication server
        working-directory: AuthPlatform/Server
        run: swift build
      - name: Run authentication tests
        working-directory: AuthPlatform/Server
        run: swift test
