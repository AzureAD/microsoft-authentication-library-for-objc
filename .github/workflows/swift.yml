name: Swift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate MSAL package and AuthPlatform server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.4"
      - name: Show Swift version
        run: swift --version
      - name: Validate root MSAL package manifest
        run: swift package dump-package > /dev/null
      - name: Build authentication server
        working-directory: AuthPlatform/Server
        run: swift build
      - name: Run authentication unit tests
        working-directory: AuthPlatform/Server
        run: swift test
