# TEMPORARY — smoke test for the GitHub Models -> Copilot CLI migration.
#
# `issues` / `issue_comment` events always run the workflow file from the
# DEFAULT branch, so the rewritten ai-issues-auto-reply.yml cannot be exercised
# until it merges. `push` events do use the branch's own file, which is the only
# way to prove the new path works before merging.
#
# This runs the risky NEW parts end to end against a real issue: npm install,
# GITHUB_TOKEN auth, the --yolo invocation, the on-disk prompt handoff, the
# reply-file guard, and the randomised GITHUB_OUTPUT delimiter.
#
# DELETE THIS FILE BEFORE MERGING.
name: zz smoke - Copilot CLI reply

on:
  push:
    branches: [fidelianawar-fix-github-issues-actions-bot]

permissions:
  issues: write
  contents: read
  copilot-requests: write

env:
  TARGET_ISSUE: "3082"
  # Guard rail: while false the reply is only written to the job summary and
  # uploaded as an artifact. Flip to "true" to actually comment on the issue.
  POST_REPLY: "true"
  COPILOT_MODEL: "auto"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Show Copilot CLI version
        run: copilot --version || true

      - name: Build prompt for the target issue
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Same prompt files the real workflow uses.
          SYSTEM_PROMPT="$(cat .github/ai-prompts/system-common.md)$(cat .github/ai-prompts/system-task-initial.md)"

          # Reference material: same manifest, same license/#import stripping,
          # at the raised budget the real workflow now uses.
          REFERENCE_FILE="$(mktemp)"
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue ;; esac
            if [[ -f "$f" ]]; then
              {
                printf '\n----- %s -----\n' "$f"
                sed -e '/^\/\/ Copyright/,/^\/\/ THE SOFTWARE\./d' -e '/^#import/d' "$f" | head -c 25000
              } >> "$REFERENCE_FILE"
            else
              echo "::warning::reference file missing: $f"
            fi
          done < .github/ai-prompts/reference-files.txt
          echo "Reference material: $(wc -c < "$REFERENCE_FILE") bytes."

          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_ISSUE}")"
          ISSUE_TITLE="$(jq -r '.title' <<< "$ISSUE_JSON")"
          ISSUE_BODY="$(jq -r '.body // ""' <<< "$ISSUE_JSON")"
          ISSUE_URL="$(jq -r '.html_url' <<< "$ISSUE_JSON")"

          PROMPT_FILE="$PWD/ai_prompt.md"
          {
            printf '%s\n\n' "$SYSTEM_PROMPT"
            printf '=== REFERENCE MATERIAL (for grounding) ===\n'
            cat "$REFERENCE_FILE"
            printf '\n\n=== NEW ISSUE ===\nNew issue at: %s \nTitle: %s \n\nBody:\n%s\n' \
              "$ISSUE_URL" "$ISSUE_TITLE" "$ISSUE_BODY"
          } > "$PROMPT_FILE"
          rm -f "$REFERENCE_FILE"

          echo "Prompt assembled: $(wc -c < "$PROMPT_FILE") bytes."

      - name: Generate reply with Copilot CLI
        id: ai
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROMPT_FILE="$PWD/ai_prompt.md"
          REPLY_FILE="$PWD/ai_reply.md"
          rm -f "$REPLY_FILE"

          set +e
          copilot \
            --yolo \
            --no-color \
            --no-ask-user \
            --disable-builtin-mcps \
            --log-level none \
            --model "${COPILOT_MODEL:-auto}" \
            -p "Read the file ${PROMPT_FILE}. It contains a system prompt followed by the GitHub issue to answer. Follow those instructions and compose the reply comment they describe. Do not modify any file in this repository, do not run git, and do not post anything to GitHub. Your only side effect must be writing the finished comment — GitHub-flavoured Markdown, no preamble, no code fence around the whole thing — to ${REPLY_FILE}."
          COPILOT_EXIT=$?
          set -e

          echo "copilot exit: ${COPILOT_EXIT}"
          if [[ $COPILOT_EXIT -ne 0 ]]; then
            echo "::error::Copilot CLI exited ${COPILOT_EXIT}."
            exit 1
          fi
          if [[ ! -s "$REPLY_FILE" ]]; then
            echo "::error::Copilot CLI wrote no reply to ${REPLY_FILE} — this is the failure mode to watch for."
            exit 1
          fi

          echo "Reply: $(wc -c < "$REPLY_FILE") bytes."

          DELIM="AIREPLY_$(openssl rand -hex 12)"
          {
            echo "text<<${DELIM}"
            cat "$REPLY_FILE"
            echo ""
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish reply to job summary
        run: |
          {
            echo "## Generated reply for issue #${TARGET_ISSUE}"
            echo ""
            echo "POST_REPLY=${POST_REPLY}"
            echo ""
            echo '<details><summary>Reply body</summary>'
            echo ""
            cat ai_reply.md
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reply artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-reply
          path: ai_reply.md

      - name: Post reply to the issue
        if: env.POST_REPLY == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai_reply.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.TARGET_ISSUE),
              body: body
                + '\n\n---\n\n'
                + '**Need further assistance?** Comment with `PING-COPILOT: <your question>` to trigger a follow-up.\n\n'
                + '**Want to disable automated replies on this issue?** Comment with `STOP-COPILOT`.\n\n'
                + '<!-- AI-autoreply -->\n'
                + '_This comment was generated by an automated assistant to help with initial triage. A maintainer will follow up as needed._'
            });
