# Production Fly.io deployment for the AuthPlatform Vapor API.
# Create this app once with: fly apps create dabelstech-authplatform-prod
# Attach a production PostgreSQL cluster and configure application secrets before deploying.
app = "dabelstech-authplatform-prod"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[deploy]
  # Fly runs this once against the new image before routing traffic to the release.
  release_command = "/bin/sh -lc 'DATABASE_URL=$DIRECT_DATABASE_URL /app/App migrate --yes'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
