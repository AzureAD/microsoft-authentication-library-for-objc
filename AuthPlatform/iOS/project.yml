name: AuthPlatform
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.example
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AuthPlatform:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Authentication
      - path: Resources/ApplePasswordManager
        buildPhase: resources
    info:
      path: App/Info.plist
    entitlements:
      path: AuthPlatform.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.authplatform
        PRODUCT_NAME: AuthPlatform
    dependencies:
      - target: CredentialProviderExtension
        embed: true

  CredentialProviderExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CredentialProviderExtension
      - path: Authentication/SharedCredentialVault.swift
      - path: Authentication/ApplePasswordManagerResources.swift
      - path: Resources/ApplePasswordManager
        buildPhase: resources
    info:
      path: CredentialProviderExtension/Info.plist
    entitlements:
      path: CredentialProviderExtension/CredentialProvider.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.authplatform.CredentialProviderExtension
        PRODUCT_NAME: CredentialProviderExtension
        APPLICATION_EXTENSION_API_ONLY: YES
