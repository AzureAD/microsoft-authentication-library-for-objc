trigger: none
pr: none

resources:
  repositories:
    - repository: pipelinesShared
      type: git
      name: IDDP/MSAL-ObjC-Pipelines
      ref: refs/heads/main

stages:
  - stage: TimeoutStage
    displayName: Controlled timeout for retry verification
    jobs:
      - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
        parameters:
          jobName: TimeoutOnce
          displayName: Time out once, pass on retry
          timeoutInMinutes: 1
          selectXcode: false
          installSlather: false
          installXcpretty: false
          installBundler: false
          installCocoaPods: false
          installXcbeautify: false
          steps:
            - checkout: none
            - bash: |
                set -euo pipefail
                echo "PROBE_TIMEOUT_JOB_STAGE_ATTEMPT=${STAGE_ATTEMPT}"
                if [ "${STAGE_ATTEMPT}" = "1" ]; then
                  echo "Waiting for the server-enforced one-minute job timeout."
                  sleep 90
                  echo "Expected the server to terminate this first attempt."
                  exit 1
                fi
                echo "Retry completed successfully."
              env:
                STAGE_ATTEMPT: $(System.StageAttempt)

      - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
        parameters:
          jobName: SuccessfulControl
          displayName: Successful job that should not be retried
          timeoutInMinutes: 2
          selectXcode: false
          installSlather: false
          installXcpretty: false
          installBundler: false
          installCocoaPods: false
          installXcbeautify: false
          steps:
            - checkout: none
            - bash: echo "PROBE_CONTROL_JOB_ATTEMPT=$(System.JobAttempt)"

  - stage: RecoveryStage
    displayName: Probe native retry while this run is active
    dependsOn: TimeoutStage
    condition: always()
    jobs:
      - template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
        parameters:
          jobName: ProbeRetry
          displayName: Capture stage-retry and build-retry API responses
          timeoutInMinutes: 5
          selectXcode: false
          installSlather: false
          installXcpretty: false
          installBundler: false
          installCocoaPods: false
          installXcbeautify: false
          steps:
            - checkout: none
            - task: Bash@3
              displayName: Retry probe (first recovery attempt only)
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                ORGANIZATION_URL: $(System.CollectionUri)
                PROJECT_ID: $(System.TeamProjectId)
                BUILD_ID: $(Build.BuildId)
                STAGE_ATTEMPT: $(System.StageAttempt)
              inputs:
                targetType: inline
                script: |
                  set -euo pipefail
                  python3 -u - <<'PY'
                  import json
                  import os
                  import time
                  import urllib.error
                  import urllib.request

                  if int(os.environ["STAGE_ATTEMPT"]) != 1:
                      print("PROBE_RETRY_GUARD: no further retry requests.")
                      raise SystemExit(0)

                  base = "{}/{}/_apis/build/builds/{}".format(
                      os.environ["ORGANIZATION_URL"].rstrip("/"),
                      os.environ["PROJECT_ID"],
                      os.environ["BUILD_ID"],
                  )
                  headers = {
                      "Authorization": "Bearer " + os.environ["SYSTEM_ACCESSTOKEN"],
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  }

                  def get(path):
                      request = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return json.load(response)

                  build = get("?api-version=7.1")
                  timeline = get("/timeline?api-version=7.1")
                  stage = next(
                      record for record in timeline["records"]
                      if record["type"] == "Stage"
                      and record.get("identifier") == "TimeoutStage"
                  )
                  print("PROBE_PRECONDITION: " + json.dumps({
                      "buildId": build["id"],
                      "buildStatus": build["status"],
                      "targetStageState": stage["state"],
                      "targetStageResult": stage["result"],
                      "targetStageAttempt": stage["attempt"],
                  }), flush=True)
                  if build["status"] != "inProgress" or stage["state"] != "completed":
                      raise RuntimeError("The live retry preconditions were not met.")
                  if stage["result"] not in ("failed", "canceled"):
                      raise RuntimeError("The target stage did not fail as expected.")

                  probes = (
                      ("stage", "/stages/TimeoutStage?api-version=7.1",
                       {"state": "retry", "forceRetryAllJobs": False}),
                      ("build", "?retry=true&api-version=7.1",
                       {"id": build["id"], "status": "inProgress"}),
                  )
                  for name, path, payload in probes:
                      request = urllib.request.Request(
                          base + path, method="PATCH", headers=headers,
                          data=json.dumps(payload).encode("utf-8"),
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=20) as response:
                              print("PROBE_RESPONSE: " + json.dumps({
                                  "endpoint": name, "httpStatus": response.status,
                                  "accepted": True,
                              }), flush=True)
                          raise SystemExit(0)
                      except urllib.error.HTTPError as error:
                          body = error.read().decode("utf-8")
                          try:
                              detail = json.loads(body)
                          except json.JSONDecodeError:
                              detail = {"message": "Non-JSON error response"}
                          print("PROBE_RESPONSE: " + json.dumps({
                              "endpoint": name,
                              "httpStatus": error.code,
                              "typeKey": detail.get("typeKey"),
                              "message": detail.get("message"),
                              "accepted": False,
                          }), flush=True)

                  print("PROBE_BOTH_REJECTED: holding the run open for observation.",
                        flush=True)
                  time.sleep(120)
                  PY
