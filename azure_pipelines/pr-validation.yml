variables:
  - name: GEM_HOME
    value: $(Agent.TempDirectory)/.gem
  - name: arch
    value: arm64

# Pipeline will be triggered for PR & any updates on the PR on all branches
pr:
  autoCancel: true
  branches:
    include:
    - '*'
  drafts: true

# Trigger CI for only main/release branches
trigger:
  branches:
    include:
    - main
    - release/*
    exclude:
    - '*'

resources:
  repositories:
    # Shared ACES macOS job template (pool + Xcode + tool setup) — source of truth.
    # TODO: switch ref to 'main' once ameyapat/common-aces-config is merged.
    - repository: pipelinesShared
      type: git
      name: IDDP/MSAL-ObjC-Pipelines
      ref: refs/heads/main

# Define parallel jobs that run build script for specified targets
# Note: visionOS validation moved to visionos-validation.yml (runs on PRs to main, and on pushes to main and release/*)
jobs:
- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: Validate_Pull_Request_iOS
    displayName: Validate Pull Request (iOS)
    timeoutInMinutes: 30
    selectXcode: false
    installSlather: true
    installXcpretty: true
    installBundler: true
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - checkout: self
        clean: true
        submodules: true
        fetchDepth: 1
        persistCredentials: false
      - task: Bash@3
        displayName: Removing any lingering codecov files. These can cause issues when the xcode version changes
        inputs:
          targetType: 'inline'
          script: |
            find . -name "*.gcda" -print0 | xargs -0 rm
      - task: ComponentGovernanceComponentDetection@0
        inputs:
          alertWarningLevel: Low
      - task: Bash@3
        displayName: Run Build script & check for Errors
        inputs:
          targetType: 'inline'
          script: |
            rm -f ./build/status.txt
            { output=$(./build.py --coverage --targets iosFramework iosTestApp sampleIosApp sampleIosAppSwift 2>&1 1>&3-) ;} 3>&1
            build_exit=$?
            final_status=$(cat ./build/status.txt 2>/dev/null || true)
            final_status=${final_status:-$build_exit}
            echo "FINAL STATUS  = ${final_status}"
            echo "POSSIBLE ERRORS: ${output}"

            if [ "$final_status" != "0" ] || [ "$build_exit" != "0" ]; then
              echo "Build & Testing Failed! \n ${output}" >&2
              exit 1
            fi
          failOnStderr: true
      - template: templates/coverage-handoff.yml
        parameters:
          target: iosFramework
      - task: Bash@3
        condition: always()
        displayName: Cleanup
        inputs:
          targetType: 'inline'
          script: |
            rm -rf ./build/status.txt
      - task: PublishTestResults@2
        condition: always()
        displayName: Publish Test Report
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(Agent.BuildDirectory)/s/build/reports/*'
          failTaskOnFailedTests: true
          testRunTitle: 'Test Run - iosFramework'

