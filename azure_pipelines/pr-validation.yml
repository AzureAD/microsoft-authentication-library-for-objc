# Publish once: parallel test jobs must not overwrite the native HTML landing page.
- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: Publish_coverage
    displayName: Publish MSAL coverage
    dependsOn: [Validate_Pull_Request_iOS, Validate_Pull_Request_macOS]
    condition: succeededOrFailed()
    selectXcode: false
    installSlather: false
    installXcpretty: false
    installBundler: false
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - checkout: self
        path: s

      - task: DownloadPipelineArtifact@2
        displayName: Download scheme coverage reports
        inputs:
          buildType: current
          itemPattern: '**/*.cobertura.xml'
          targetPath: '$(Build.SourcesDirectory)/build/coverage/reports'

      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Prepare validated publication copies
        inputs:
          workingDirectory: '$(Build.SourcesDirectory)'
          targetType: inline
          script: ruby scripts/coverage.rb prepare-publication build/coverage/reports build/coverage/publication

      # The native publisher also requires .NET; restore HTML tooling only later.
      - task: UseDotNet@2
        condition: succeededOrFailed()
        displayName: Set up coverage report runtime
        inputs:
          packageType: sdk
          version: '8.x'

      # Retain failure status for missing schemes but still publish valid inputs.
      - task: PublishCodeCoverageResults@2
        condition: succeededOrFailed()
        displayName: Publish code coverage
        inputs:
          summaryFileLocation: '$(Build.SourcesDirectory)/build/coverage/publication/*.cobertura.xml'
          pathToSources: '$(Build.SourcesDirectory)'
          failIfCoverageEmpty: true

      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Restore pinned HTML report generator
        inputs:
          workingDirectory: '$(Build.SourcesDirectory)'
          targetType: inline
          script: dotnet tool restore --tool-manifest .config/dotnet-tools.json

      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Generate iOS coverage HTML
        inputs:
          workingDirectory: '$(Build.SourcesDirectory)'
          targetType: inline
          script: |
            dotnet tool run reportgenerator -- \
              "-reports:build/coverage/publication/MSAL (iOS Framework).cobertura.xml" \
              "-targetdir:build/coverage/html/iOS" \
              "-sourcedirs:$PWD" \
              "-reporttypes:Html" \
              "-title:MSAL iOS coverage"

      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        displayName: Publish iOS coverage HTML
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/coverage/html/iOS'
          artifact: 'MSAL iOS coverage HTML - $(System.JobAttempt)'

      - task: Bash@3
        condition: succeededOrFailed()
        displayName: Generate macOS coverage HTML
        inputs:
          workingDirectory: '$(Build.SourcesDirectory)'
          targetType: inline
          script: |
            dotnet tool run reportgenerator -- \
              "-reports:build/coverage/publication/MSAL (Mac Framework).cobertura.xml" \
              "-targetdir:build/coverage/html/macOS" \
              "-sourcedirs:$PWD" \
              "-reporttypes:Html" \
              "-title:MSAL macOS coverage"

      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        displayName: Publish macOS coverage HTML
        inputs:
          targetPath: '$(Build.SourcesDirectory)/build/coverage/html/macOS'
          artifact: 'MSAL macOS coverage HTML - $(System.JobAttempt)'

- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: fetch_pr_labels
    displayName: 'Check for PR Label'
    timeoutInMinutes: 5
    selectXcode: false
    installSlather: false
    installXcpretty: false
    installBundler: false
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - script: |
          url="https://api.github.com/repos/$BUILD_REPOSITORY_ID/issues/$SYSTEM_PULLREQUEST_PULLREQUESTNUMBER/labels"

          echo "Fetching labels from $url "

          # Temporary file to store the raw response
          temp_file=$(mktemp)

          # Store the response code and the raw response in separate variables
          response_code=$(curl -s -w "%{http_code}" -o "$temp_file" "$url")
          response_content=$(cat "$temp_file")

          echo "Response code: $response_code"
          echo "Raw response: $response_content"

          if [[ "$response_code" -eq 200 ]]; then
            label_names=$(echo $response_content | jq -r '.[].name' | paste -sd ', ' -)
            echo "##vso[task.setvariable variable=PR_LABELS;isOutput=true]$label_names"
            [ -z "$label_names" ] && echo "PR labels: <empty>" || echo "PR labels: $label_names"
          else
            echo "Request failed with status code: $response_code - Skipping Native Auth E2E tests as a preventive measure"
            echo "##vso[task.setvariable variable=PR_LABELS;isOutput=true]'skip-native-auth-e2e-tests'"
          fi
        name: fetchPrLabels

- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: e2e_test_native_auth_ios
    displayName: 'Run MSAL E2E tests for iOS native auth'
    timeoutInMinutes: 30
    dependsOn: [fetch_pr_labels]
    condition: and( succeeded(), not(contains(dependencies.fetch_pr_labels.outputs['fetchPrLabels.PR_LABELS'], 'skip-native-auth-e2e-tests')) )
    selectXcode: false
    installSlather: false
    installXcpretty: false
    installBundler: false
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - template: templates/tests-with-conf-file.yml
        parameters:
          schema: 'MSAL iOS Native Auth E2E Tests'
          destination: 'platform=iOS Simulator,name=$(IOS_SIM_DEVICE),OS=$(IOS_SIM_OS)'
          sdk: 'iphonesimulator'
          retry_tests: 'false'

- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: e2e_test_native_auth_mac
    displayName: 'Run MSAL E2E tests for macOS native auth'
    timeoutInMinutes: 30
    dependsOn: [fetch_pr_labels]
    condition: and( succeeded(), not(contains(dependencies.fetch_pr_labels.outputs['fetchPrLabels.PR_LABELS'], 'skip-native-auth-e2e-tests')) )
    selectXcode: false
    installSlather: false
    installXcpretty: false
    installBundler: false
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - template: templates/tests-with-conf-file.yml
        parameters:
          schema: 'MSAL Mac Native Auth E2E Tests'
          destination: 'platform=macOS'
          sdk: 'macosx'
          retry_tests: 'false'

- template: Pipeline YAMLs/shared/aces-macos-job.yml@pipelinesShared
  parameters:
    jobName: Validate_SPM_Integration
    displayName: Validate SPM Integration
    timeoutInMinutes: 15
    selectXcode: false
    installSlather: false
    installXcpretty: false
    installBundler: false
    installCocoaPods: false
    installXcbeautify: false
    steps:
      - checkout: self
        clean: true
        submodules: true
        fetchDepth: 1
        persistCredentials: true
        path: s

      # Note: visionOS SPM validation is in visionos-validation.yml (runs on PRs to main, and on pushes to main and release/*)

      - task: Bash@3
        displayName: Set variable BRANCH_NAME to a temporary branch
        inputs:
          targetType: 'inline'
          script: |
            BRANCH_NAME_LOCAL="${BUILD_SOURCEBRANCHNAME}-temp"
            echo "##vso[task.setvariable variable=BRANCH_NAME]${BRANCH_NAME_LOCAL}"

      - task: Bash@3
        displayName: Checkout to temporary branch
        inputs:
          targetType: 'inline'
          script: |
            git checkout -b "${BRANCH_NAME}"

      - task: Bash@3
        displayName: Run SPM integration test script
        inputs:
          targetType: 'inline'
          script: |
            sh spm-integration-test.sh "${BRANCH_NAME}"
        continueOnError: false

      - task: Bash@3
        condition: always()
        displayName: Cleanup
        inputs:
          targetType: 'inline'
          workingDirectory: '$(Build.SourcesDirectory)'
          script: |
            cd "$(Build.SourcesDirectory)"
            rm -rf "$SAMPLE_APP_TEMP_DIR" archive framework MSAL.zip
            git checkout -- .
            git fetch --quiet
            git switch "$BUILD_SOURCEBRANCHNAME"
            git branch -D "$BRANCH_NAME"
            git push origin --delete "$BRANCH_NAME"
