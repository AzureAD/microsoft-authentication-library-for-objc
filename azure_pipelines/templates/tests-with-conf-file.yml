parameters:
  - name: schema
    type: string
  - name: destination
    type: string
  - name: sdk
    type: string
  - name: retry_tests
    type: string
    default: 'false'
  - name: ui_code_coverage
    type: boolean
    default: false

steps:
  - checkout: self
    clean: true
    submodules: true
    fetchDepth: 1
    persistCredentials: true
    path: s
    
  - task: Bash@3
    displayName: Go to project folder
    inputs:
      targetType: 'inline'
      script: |        
        cd $(Agent.BuildDirectory)/s
  
  - script: gem uninstall xcpretty -I --version 0.4.0 || true
    displayName: 'Uninstall xcpretty v0.4.0'
  
  - script: |
      export PATH="$GEM_HOME/bin:$PATH"
      gem install xcpretty -v 0.3.0
      gem install xcodeproj -N -v 1.27.0
    displayName: 'Install xcpretty v0.3.0 and xcodeproj'

  - task: AzureCLI@2
    displayName: 'Read configuration from KeyVault'
    inputs:
      azureSubscription: 'AuthSdkResourceManager'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: 'python3 get_automation_conf_file.py'
      workingDirectory: azure_pipelines/scripts/

  - task: AzureKeyVault@2
    displayName: 'Fetch LabAuth from Key Vault'
    inputs:
      azureSubscription: 'AuthSdkResourceManager'
      KeyVaultName: 'msidlabs'
      SecretsFilter: 'LabAuth'

  - task: Bash@3
    displayName: Build for testing
    inputs:
      targetType: 'inline'
      script: |
        set -o pipefail
        export PATH="$GEM_HOME/bin:$PATH"
        export LANG=en_US.UTF-8
        export LC_ALL=en_US.UTF-8
        mv azure_pipelines/scripts/conf.json MSAL/test/automation/conf.json
        mkdir -p ~/aadtests
        cp MSAL/test/automation/conf.json ~/aadtests/conf.json
        ruby TestRubyFile.rb
        COVERAGE_ARGS=()
        if [[ '${{ parameters.ui_code_coverage }}' =~ ^[Tt]rue$ ]]; then
          COVERAGE_ARGS=(-enableCodeCoverage YES)
        fi
        xcodebuild build-for-testing \
          -workspace MSAL.xcworkspace \
          -scheme '${{ parameters.schema }}' \
          -sdk ${{ parameters.sdk }} \
          -destination '${{ parameters.destination }}' \
          -derivedDataPath 'build' \
          "${COVERAGE_ARGS[@]}" \
          | tee xcodebuild.log \
          | xcpretty -c
    env:
      KEYVAULT_CERTIFICATE_DATA: $(LabAuth)

  - ${{ if eq(parameters.ui_code_coverage, true) }}:
    - task: Bash@3
      displayName: Prepare XCUITest production coverage
      # Still execute the existing tests if preparation fails; mandatory collection then fails visibly.
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          python3 -m unittest discover -s azure_pipelines/scripts -p 'test_automation_coverage.py'
          python3 azure_pipelines/scripts/automation_coverage.py prepare \
            --root '$(Build.SourcesDirectory)' \
            --output '$(Build.SourcesDirectory)/automation_coverage' \
            --scheme '${{ parameters.schema }}' \
            --destination '${{ parameters.destination }}'
      env:
        COVERAGE_BUILD_ID: $(Build.BuildId)
        COVERAGE_STAGE_ATTEMPT: $(System.StageAttempt)
        COVERAGE_JOB_ATTEMPT: $(System.JobAttempt)
        COVERAGE_RETRY_TESTS: ${{ parameters.retry_tests }}

  - ${{ if eq(parameters.retry_tests, 'true') }}:    
    - task: Bash@3
      displayName: Run automations
      inputs:
        targetType: 'inline'
        script: |
          ls build/Build/Products/
          XCTESTRUN=$(ls "build/Build/Products/${{ parameters.schema }}"*.xctestrun 2>/dev/null | head -n1)
          if [ -z "$XCTESTRUN" ]; then
            echo "No .xctestrun file found for scheme '${{ parameters.schema }}'"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          echo "Using xctestrun: $XCTESTRUN"
          COVERAGE_ARGS=()
          if [[ '${{ parameters.ui_code_coverage }}' =~ ^[Tt]rue$ ]]; then
            COVERAGE_ARGS=(-enableCodeCoverage YES)
          fi
          xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              "${COVERAGE_ARGS[@]}" \
              -destination '${{ parameters.destination }}' \
              -retry-tests-on-failure \
              -test-iterations 3 \
              -parallel-testing-enabled NO \
              -quiet \
              -resultBundlePath '$(Agent.BuildDirectory)/s/test_output/report.xcresult'
      env:
        KEYVAULT_CERTIFICATE_DATA: $(LabAuth)
  - ${{ if eq(parameters.retry_tests, 'false') }}:    
    - task: Bash@3
      displayName: Run automations
      inputs:
        targetType: 'inline'
        script: |
          ls build/Build/Products/
          XCTESTRUN=$(ls "build/Build/Products/${{ parameters.schema }}"*.xctestrun 2>/dev/null | head -n1)
          if [ -z "$XCTESTRUN" ]; then
            echo "No .xctestrun file found for scheme '${{ parameters.schema }}'"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          echo "Using xctestrun: $XCTESTRUN"
          COVERAGE_ARGS=()
          if [[ '${{ parameters.ui_code_coverage }}' =~ ^[Tt]rue$ ]]; then
            COVERAGE_ARGS=(-enableCodeCoverage YES)
          fi
          xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" \
              "${COVERAGE_ARGS[@]}" \
              -destination '${{ parameters.destination }}' \
              -parallel-testing-enabled NO \
              -resultBundlePath '$(Agent.BuildDirectory)/s/test_output/report.xcresult'
      env:
        KEYVAULT_CERTIFICATE_DATA: $(LabAuth)

  - ${{ if eq(parameters.ui_code_coverage, true) }}:
    - task: Bash@3
      condition: succeededOrFailed()
      displayName: Export XCUITest MSAL coverage (all retry iterations)
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          python3 azure_pipelines/scripts/automation_coverage.py collect \
            --root '$(Build.SourcesDirectory)' \
            --output '$(Build.SourcesDirectory)/automation_coverage'

    # One native publisher for this pilot; Native Auth jobs do not publish coverage.
    - task: PublishCodeCoverageResults@2
      condition: and(succeededOrFailed(), eq(variables['msalUiCoverageReady'], 'true'))
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/automation_coverage/reports/msal-xcuitest-*.cobertura.xml'
        pathToSources: '$(Build.SourcesDirectory)'
        failIfCoverageEmpty: true

    - task: PublishPipelineArtifact@1
      condition: succeededOrFailed()
      displayName: Retain matched XCUITest coverage evidence
      inputs:
        targetPath: '$(Build.SourcesDirectory)/automation_coverage'
        artifactName: 'MSAL-XCUITest-Coverage-$(Build.BuildId)-stage$(System.StageAttempt)-job$(System.JobAttempt)'
        publishLocation: pipeline

  # https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/pipeline-artifacts?view=azure-devops&tabs=yaml#q-can-i-delete-pipeline-artifacts-when-re-running-failed-jobs
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Agent.BuildDirectory)/s/test_output/'
      artifactName: 'TestOutputs Attempt - $(System.StageAttempt) - ${{ parameters.schema }}'
      publishLocation: 'pipeline'

  # Ensure the diagnostic-reports folder always exists so the publish step
  # below doesn't fail when the test exited non-zero without producing a
  # crash report (xctest timeout / assertion failure / xcodebuild error).
  - task: Bash@3
    condition: failed()
    displayName: "Ensure crash report folder exists"
    inputs:
      targetType: 'inline'
      script: |
        CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
        mkdir -p "$CRASH_DIR"
        echo "##vso[task.setvariable variable=crashReportFolder]$CRASH_DIR"

  - task: PublishPipelineArtifact@1
    condition: failed()
    displayName: "Publish crash report if any"
    inputs:
      targetPath: "$(crashReportFolder)"
      artifactName: "crash folder"
      publishLocation: "pipeline"
  
